<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile - EcoConnect</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
      }

      /* Navigation Bar */
      .navbar {
        height: 60px;
        background-color: #2e7d32;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
      }

      .navbar .nav-left,
      .navbar .nav-right {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      /* Sidebar */
      .sidebar {
        width: 200px;
        height: calc(100vh - 60px);
        background-color: #388e3c;
        padding: 20px 0;
        color: #fff;
        position: fixed;
        top: 60px;
        left: 0;
      }

      .sidebar a {
        display: block;
        padding: 15px 20px;
        color: #fff;
        text-decoration: none;
        transition: background 0.3s;
      }

      .sidebar a:hover,
      .sidebar a.active {
        background-color: #2e7d32;
      }

      /* Main Content */
      .main-content {
        margin-left: 200px;
        padding: 20px;
        margin-top: 60px;
      }
      
      /* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 20px;
  margin-bottom: 40px;
}

.stat-box {
  background-color: #fff;
  padding: 20px;
  border-left: 6px solid #2e7d32;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.05);
  text-align: center;
}

.stat-box h4 {
  font-size: 18px;
  color: #2e7d32;
  margin-bottom: 10px;
}

.stat-box p {
  font-size: 24px;
  font-weight: bold;
  color: #444;
}

    </style>
  </head>
  <body>
    <!-- Navigation Bar -->
    <div class="navbar">
      <div class="nav-left">
        <h2>Dashboard</h2>
      </div>
      <div class="nav-right">
        <span>User</span>
        <span>Username</span>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <a href="dashboard.html">Dashboard</a>
     <a href="History.html">History</a>
      
      <a href="profile.html" class="active">Profile</a>
      <a href="notification.html">Notification</a>
      <a href="index.html">Logout</a>
    </div>

    <!-- Main Content - Profile -->
    <!-- Main Content - Dashboard Stats -->
<div class="main-content">
  <h3>Dashboard Overview</h3>

  <div class="stats-grid">
    <div class="stat-box">
      <h4>Total Requests</h4>
      <p>120</p>
    </div>
    <div class="stat-box">
      <h4>Pending Requests</h4>
      <p>35</p>
    </div>
    <div class="stat-box">
      <h4>Completed Pickups</h4>
      <p>80</p>
    </div>
    <div class="stat-box">
      <h4>Total Waste Collected</h4>
      <p>2,350 kg</p>
    </div>
  </div>
</div>

  </body>
</html>
